<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Pool — FlightPool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <header class="auth-top">
        <a class="back-btn" href="matches.html" aria-label="Back to matches">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M15 5l-7 7 7 7"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
        <a class="logo" href="index.html" aria-label="FlightPool home">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <rect width="32" height="32" rx="8" fill="#E96A22" />
              <path
                d="M8.2 18.4c2.1-1.1 4.6-2.1 7.8-2.1s5.7 1 7.8 2.1"
                stroke="#fff"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M10.4 13.2c1.7-.7 3.6-1.1 5.6-1.1s3.9.4 5.6 1.1"
                stroke="#fff"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle cx="11.2" cy="20.6" r="1.7" fill="#fff" />
              <circle cx="16" cy="21.2" r="1.7" fill="#fff" />
              <circle cx="20.8" cy="20.6" r="1.7" fill="#fff" />
              <path
                d="M16 8.2l1.1 2.4 2.6.2-2.1 1.6.7 2.5L16 13.6l-2.3 1.3.7-2.5-2.1-1.6 2.6-.2L16 8.2z"
                fill="#fff"
              />
            </svg>
          </span>
          <span class="logo-text">FlightPool</span>
        </a>
      </header>

      <section class="auth-view is-active">
        <p class="eyebrow">No perfect match yet?</p>
        <h1>Create your ride group</h1>

        <div class="dark-flight-card">
          <div class="dark-flight-row dark-flight-row-create">
            <div class="dark-flight-line">
              <span class="dark-flight-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M21 15.5l-9 5-9-5 9-10 9 10z"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <p class="dark-flight-code" id="cp-flight-code">6E 123</p>
            </div>
            <div class="dark-flight-line">
              <span class="dark-flight-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M21 15.5l-9 5-9-5 9-10 9 10z"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M12 22V9"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
              <p id="cp-route">Delhi → Hyderabad</p>
            </div>
            <div class="dark-flight-line">
              <span class="dark-flight-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M12 21s-7-6.3-7-11.5a7 7 0 0 1 14 0c0 5.2-7 11.5-7 11.5z"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linejoin="round"
                  />
                  <circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.6" />
                </svg>
              </span>
              <p id="cp-destination">Going to: Gachibowli</p>
            </div>
          </div>
        </div>

        <form id="create-pool-form">
          <label class="pill-field">
            <span class="pill-field-label">Maximum group size</span>
            <div class="pill-row pill-row-4" role="radiogroup" aria-label="Group size">
              <button
                type="button"
                class="pill-card"
                role="radio"
                aria-checked="false"
                data-size="2"
              >
                2
              </button>
              <button
                type="button"
                class="pill-card"
                role="radio"
                aria-checked="false"
                data-size="3"
              >
                3
              </button>
              <button
                type="button"
                class="pill-card is-active"
                role="radio"
                aria-checked="true"
                data-size="4"
              >
                4
              </button>
              <button
                type="button"
                class="pill-card"
                role="radio"
                aria-checked="false"
                data-size="5"
              >
                5
              </button>
            </div>
          </label>

          <label class="pill-field">
            <span class="pill-field-label">Pool type</span>
            <div class="pill-row pill-row-2" role="radiogroup" aria-label="Pool type">
              <button
                type="button"
                class="pill-card pill-card-wide is-active"
                role="radio"
                aria-checked="true"
                data-pool="everyone"
              >
                Everyone
              </button>
              <button
                type="button"
                class="pill-card pill-card-wide"
                role="radio"
                aria-checked="false"
                data-pool="women"
              >
                <span class="pill-card-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path
                      d="M7 18c2.4 0 4-1.2 4-2.8V9.8M9.5 6.6c.9-1 3.1-1 4 0M4.5 11.5c-.4 1 .9 1.7 2 1.7 1.1 0 2.5-.6 2.1-1.7-.3-.8-1.4-1.3-2-1.3-1 0-2.1.5-2.1 1.3z"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
                Women only
              </button>
            </div>
          </label>

          <p class="pool-note">
            Women-only pools are available for travelers who prefer to travel
            with other women.
          </p>

          <p class="field-error" id="cp-error" hidden></p>

          <button class="btn-primary auth-submit btn-submit-rounded" type="submit">
            Create Pool
          </button>
        </form>
      </section>
    </main>

    <script src="js/create-pool.js"></script>
  </body>
</html>
