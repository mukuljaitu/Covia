<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — FlightPool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script>
      // Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyD1qxQPZQtLTGVyvKpNOvN6UiRauRS4q_A",
        authDomain: "covia-926bb.firebaseapp.com",
        projectId: "covia-926bb",
        storageBucket: "covia-926bb.firebasestorage.app",
        messagingSenderId: "1091554629460",
        appId: "1:1091554629460:web:16c9fa687506ab7d64dac1",
        measurementId: "G-0XDWQTLCQV"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      
      // Make auth available globally
      window.firebaseAuth = firebase.auth();
      window.firebaseRecaptchaVerifier = null;
      window.confirmationResult = null;
    </script>
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <header class="auth-top">
        <a class="back-btn" href="index.html" aria-label="Back to home">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M15 5l-7 7 7 7"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
        <a class="logo" href="index.html" aria-label="FlightPool home">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <rect width="32" height="32" rx="8" fill="#E96A22" />
              <path
                d="M8.2 18.4c2.1-1.1 4.6-2.1 7.8-2.1s5.7 1 7.8 2.1"
                stroke="#fff"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M10.4 13.2c1.7-.7 3.6-1.1 5.6-1.1s3.9.4 5.6 1.1"
                stroke="#fff"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle cx="11.2" cy="20.6" r="1.7" fill="#fff" />
              <circle cx="16" cy="21.2" r="1.7" fill="#fff" />
              <circle cx="20.8" cy="20.6" r="1.7" fill="#fff" />
              <path
                d="M16 8.2l1.1 2.4 2.6.2-2.1 1.6.7 2.5L16 13.6l-2.3 1.3.7-2.5-2.1-1.6 2.6-.2L16 8.2z"
                fill="#fff"
              />
            </svg>
          </span>
          <span class="logo-text">FlightPool</span>
        </a>
      </header>

      <section class="auth-view is-active" id="view-signin">
        <p class="eyebrow">Welcome to FlightPool</p>
        <h1>Your airport ride doesn’t have to be solo.</h1>
        <p class="auth-lede">
          Sign in with a quick OTP to find your ride group.
        </p>

        <form id="signin-form" novalidate>
          <div class="method-list" role="radiogroup" aria-label="Sign in method">
            <button
              class="method-card is-active"
              type="button"
              role="radio"
              aria-checked="true"
              data-method="phone"
            >
              <span class="method-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect
                    x="7"
                    y="3"
                    width="10"
                    height="18"
                    rx="2.2"
                    stroke="currentColor"
                    stroke-width="1.7"
                  />
                  <path
                    d="M11 18.5h2"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
              <span>
                <strong>Continue with mobile number</strong>
                <small>Fastest way to verify your account</small>
              </span>
            </button>

            <button
              class="method-card"
              type="button"
              role="radio"
              aria-checked="false"
              data-method="email"
            >
              <span class="method-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect
                    x="3.5"
                    y="6"
                    width="17"
                    height="12"
                    rx="2.2"
                    stroke="currentColor"
                    stroke-width="1.7"
                  />
                  <path
                    d="M4.5 8.2L12 13l7.5-4.8"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <span>
                <strong>Continue with email</strong>
                <small>Use an email OTP instead</small>
              </span>
            </button>
          </div>

          <label>
            <span id="contact-label-text">Mobile number</span>
            <input
              id="contact-input"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="+91 98765 43210"
              required
            />
          </label>
          <p class="field-error" id="signin-error" hidden></p>

          <p class="trust">
            <span class="trust-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7" />
                <path
                  d="M8.2 12.2l2.4 2.4 5.2-5.3"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            We use OTP verification to keep your account simple and secure.
          </p>

          <button class="btn-primary auth-submit" type="submit">Continue</button>
          <div id="recaptcha-container"></div>
        </form>
      </section>

      <section class="auth-view" id="view-otp" hidden>
        <p class="eyebrow">Verify OTP</p>
        <h1>Enter the 6-digit code</h1>
        <p class="auth-lede" id="otp-lede">We sent a code to your phone.</p>

        <form id="otp-form">
          <div class="otp-row" id="otp-row">
            <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="Digit 1" />
            <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
            <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
            <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
            <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
            <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
          </div>
          <p class="field-error" id="otp-error" hidden></p>
          <p class="trust">For this prototype, use <strong>123456</strong>.</p>
          <button class="btn-primary auth-submit" type="submit">Verify</button>
          <button class="btn-ghost auth-resend" id="resend-otp" type="button">
            Resend code
          </button>
        </form>
      </section>
    </main>

    <script src="js/signin.js"></script>
  </body>
</html>
